services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tickets-local-only}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tickets
      DB_USER: tickets
      DB_PASSWORD: ${DB_PASSWORD:-tickets-local-only}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-for-hs256-0123456789}
      JWT_ISSUER: trouble-ticket-local
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/demo
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  postgres_data:
